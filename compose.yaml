services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tasklane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tasklane-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklane -d tasklane"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tasklane-data:
